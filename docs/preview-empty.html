<!doctype html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="dark light"/>
<title>对话回顾 · 2020 年 1 月</title>
<style>

:root, :root[data-theme="dark"]{
  --bg:#050509; --bg-2:#0b0b12; --ink:#f6f6f8; --muted:#9a9aa8; --dim:#666672;
  --panel:rgba(255,255,255,.045); --panel-2:rgba(255,255,255,.028);
  --line:rgba(255,255,255,.1); --line-2:rgba(255,255,255,.2);
  --human:#f6c88a; --human-2:#e0a35c; --ai:#5b8cff; --ai-2:#3f6fe0;
  --accent:#ff2d55; --accent-2:#ff6b8b; --ok:#43d19e;
  --shadow:0 24px 60px rgba(0,0,0,.45); --radius:22px;
  --glow-1:rgba(255,45,85,.22); --glow-2:rgba(91,140,255,.22);
}
:root[data-theme="light"]{
  --bg:#f7f6f3; --bg-2:#ffffff; --ink:#141418; --muted:#5d5d68; --dim:#8a8a95;
  --panel:#ffffff; --panel-2:#fbfbfd;
  --line:rgba(20,20,24,.1); --line-2:rgba(20,20,24,.2);
  --human:#c9852f; --human-2:#a96a1c; --ai:#2f5fd0; --ai-2:#1f47a8;
  --accent:#e01142; --accent-2:#c00d38; --ok:#14915f;
  --shadow:0 18px 40px rgba(20,20,24,.09); --radius:22px;
  --glow-1:rgba(255,45,85,.1); --glow-2:rgba(91,140,255,.12);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; color:var(--ink); background:var(--bg);
  font-family:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
body::before{
  content:""; position:fixed; inset:-20% -10% auto -10%; height:120vh; pointer-events:none; z-index:0;
  background:
    radial-gradient(48% 40% at 12% 2%, var(--glow-1), transparent 62%),
    radial-gradient(46% 38% at 88% 6%, var(--glow-2), transparent 60%),
    radial-gradient(50% 40% at 50% 0%, rgba(255,255,255,.05), transparent 70%);
  filter:blur(6px);
  animation:drift 26s ease-in-out infinite alternate;
}
@keyframes drift{ from{transform:translate3d(-1.5%,-1%,0) scale(1)} to{transform:translate3d(1.5%,1.5%,0) scale(1.06)} }
@media (prefers-reduced-motion: reduce){ body::before{animation:none} html{scroll-behavior:auto} *{transition-duration:.01ms !important;animation-duration:.01ms !important} }
a{color:inherit;text-decoration:none}
.progress{position:fixed;top:0;left:0;height:2px;width:0;background:linear-gradient(90deg,var(--accent),var(--ai));z-index:60;transition:width .1s linear}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 22px 72px}
.wrap.is-loading{opacity:.45;transition:opacity .15s ease}
.bar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:14px 0;margin-bottom:8px;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:blur(16px) saturate(150%);
  border-bottom:1px solid var(--line);
}
.kicker{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);flex:1;min-width:150px;font-weight:600}
.tabs{display:inline-flex;padding:3px;border-radius:999px;border:1px solid var(--line);background:var(--panel-2)}
.tab{padding:6px 14px;border-radius:999px;font-size:12.5px;color:var(--muted);font-weight:600;transition:color .15s,background .15s}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--ink);color:var(--bg)}
.actions{display:flex;gap:8px;align-items:center}
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);color:var(--ink);
  font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer;
  transition:transform .15s ease,border-color .15s ease,background .15s ease;
}
.btn:hover{transform:translateY(-1px);border-color:var(--line-2)}
.btn:active{transform:translateY(0)}
.btn.primary{
  border-color:transparent;color:#fff;
  background:linear-gradient(100deg,var(--accent),var(--accent-2));
  box-shadow:0 8px 24px -12px var(--accent);
}
.btn.primary:hover{box-shadow:0 12px 30px -12px var(--accent)}
.btn.icon{padding:7px 10px}
.btn[aria-disabled="true"]{opacity:.3;pointer-events:none}
.nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 14px}
.period-pill{
  display:inline-flex;align-items:center;gap:9px;padding:7px 16px;border-radius:999px;
  border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),transparent);
}
.period-pill .kind{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:700}
.period-pill strong{font-size:15px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.keys{font-size:11.5px;color:var(--dim);margin-left:auto}
.scrub{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.scrub::-webkit-scrollbar{display:none}
.scrub a{
  flex:0 0 auto;padding:5px 11px;border-radius:999px;border:1px solid transparent;
  font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;transition:all .15s ease;
}
.scrub a:hover{border-color:var(--line);color:var(--ink)}
.scrub a.on{background:var(--panel);border-color:var(--line-2);color:var(--ink);font-weight:600}
.scrub-label{flex:0 0 auto;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);align-self:center;margin-right:6px;font-weight:700}
.hero{padding:46px 0 40px;position:relative}
.ghost{
  position:absolute;right:-8px;top:-38px;font-size:clamp(120px,22vw,260px);font-weight:900;letter-spacing:-.06em;
  line-height:.8;color:var(--ink);opacity:.045;pointer-events:none;user-select:none;font-variant-numeric:tabular-nums;
}
.hero .punch{
  margin:0 0 14px;font-size:clamp(19px,2.6vw,26px);line-height:1.5;font-weight:700;color:var(--ink);
  letter-spacing:-.015em;max-width:none;
}
.hero .punch-pct{
  display:inline-block;margin-left:12px;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:800;
  color:var(--human);background:color-mix(in oklab,var(--human) 16%,transparent);vertical-align:3px;white-space:nowrap;
}.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:16px}
h1{
  font-size:clamp(34px,6vw,66px);line-height:1.03;margin:0 0 20px;letter-spacing:-.035em;font-weight:800;
  background:linear-gradient(120deg,var(--ink) 30%,var(--muted) 75%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
h1 em{font-style:normal;background:linear-gradient(100deg,var(--accent),var(--accent-2) 45%,var(--ai));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;max-width:720px;font-size:16px;line-height:1.75;color:var(--muted)}
.split{display:flex;height:14px;border-radius:999px;overflow:hidden;margin:30px 0 14px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}
.split .h{background:linear-gradient(90deg,var(--human-2),var(--human))}
.split .a{background:linear-gradient(90deg,var(--ai-2),var(--ai))}
.js .split .h,.js .split .a{transform-origin:left;animation:splitIn .9s cubic-bezier(.2,.8,.2,1) both}
.js .split .a{animation-delay:.12s}
@keyframes splitIn{from{transform:scaleX(.02);opacity:.4}to{transform:scaleX(1);opacity:1}}
.legend{display:flex;gap:26px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend b{color:var(--ink);font-size:17px;margin:0 4px 0 9px;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%}
.dot.h{background:var(--human);box-shadow:0 0 12px var(--human)}
.dot.a{background:var(--ai);box-shadow:0 0 12px var(--ai)}
section{margin-top:52px}
h2{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 16px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
[data-reveal]{transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0ms)}
.js [data-reveal]{opacity:0;transform:translateY(16px)}
.js [data-reveal].in{opacity:1;transform:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-top:38px}
.card{
  background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);
  border-radius:var(--radius);padding:18px;position:relative;overflow:hidden;
  transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;
}
.card::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,var(--line-2),transparent)}
.card:hover{transform:translateY(-2px);border-color:var(--line-2);box-shadow:var(--shadow)}
.kpi .label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:12px;font-weight:700}
.kpi .value{font-size:clamp(26px,3.2vw,34px);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.kpi .value small{font-size:13px;font-weight:700;color:var(--muted);margin-left:3px;letter-spacing:0}
.kpi .hint{font-size:11.5px;color:var(--dim);margin-top:10px;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.vol{display:flex;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums}
.vol .n{font-size:clamp(34px,4.6vw,50px);font-weight:800;letter-spacing:-.04em;line-height:1}
.vol .u{font-size:13px;color:var(--muted);font-weight:600}
.vol.h .n{color:var(--human)}.vol.a .n{color:var(--ai)}
.sub{font-size:12.5px;color:var(--muted);line-height:2;margin-top:10px}
.sub b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.chart{margin-top:4px;overflow:hidden}
.chart svg{display:block;overflow:visible}
.chart rect.bar{transform-box:fill-box;transform-origin:bottom}
.js .chart rect.bar{transform:scaleY(0);transition:transform .7s cubic-bezier(.2,.8,.2,1);transition-delay:calc(var(--i,0) * 26ms)}
.js .chart.in rect.bar{transform:scaleY(1)}
.chart rect.hit{fill:transparent}
.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}
.rows{display:flex;flex-direction:column;gap:11px;margin-top:2px}
.row{display:grid;grid-template-columns:minmax(64px,124px) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.row .name{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .track{height:8px;border-radius:999px;background:var(--panel);overflow:hidden;position:relative}
.row .fill{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--ai-2),var(--ai));transform-origin:left}
.js .row .fill{animation:growX .8s cubic-bezier(.2,.8,.2,1) both}
.row .fill.warm{background:linear-gradient(90deg,var(--human-2),var(--human))}
@keyframes growX{from{transform:scaleX(.02)}to{transform:scaleX(1)}}
.row .n{font-variant-numeric:tabular-nums;color:var(--ink);min-width:46px;text-align:right;font-weight:600}
.row .n i{color:var(--dim);font-style:normal;font-weight:500}
.sessions{display:flex;flex-direction:column;gap:10px}
.session .top{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
.session .title{font-size:15.5px;font-weight:700;flex:1;min-width:200px;line-height:1.4}
.session .id{font-size:11px;color:var(--dim);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.session .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px;font-variant-numeric:tabular-nums}
.session .quote{margin-top:12px;padding-left:12px;border-left:2px solid var(--line-2);font-size:12.5px;color:var(--muted);line-height:1.7}
.session .quote+.quote{margin-top:8px}
.session .more{border:0;background:none;color:var(--muted);font-size:11.5px;font-family:inherit;cursor:pointer;padding:6px 0 0;text-decoration:underline;text-underline-offset:3px}
.session[data-open="1"] .more{color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);font-size:11px;color:var(--muted)}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:9px;padding:11px 16px;border-radius:999px;
  border:1px solid var(--line);background:linear-gradient(180deg,var(--panel),transparent);
  font-size:13px;font-weight:600;transition:transform .2s ease,border-color .2s ease;
}
.chip:hover{transform:translateY(-2px);border-color:var(--line-2)}
.chip .bullet{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.note{font-size:12.5px;color:var(--muted);line-height:1.95}
.note b{color:var(--ink);font-variant-numeric:tabular-nums}
.fail{color:var(--accent-2)}

/* ── the emotional layer ─────────────────────────────────────────────── */
.moments-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:12px;align-items:start}
.stack{display:flex;flex-direction:column;gap:12px}
.card.quiet{background:linear-gradient(180deg,var(--panel-2),transparent);border-color:var(--line)}
.card .label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:700}
.tl-card{padding:20px 20px 8px}
.tl{position:relative;margin-top:14px;padding-left:18px}
.tl::before{content:"";position:absolute;left:3px;top:6px;bottom:16px;width:1px;background:linear-gradient(180deg,var(--line-2),transparent)}
.tl-item{position:relative;padding:0 0 18px}
.tl-dot{position:absolute;left:-18px;top:5px;width:7px;height:7px;border-radius:50%;background:var(--human);box-shadow:0 0 10px var(--human)}
.tl-when{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:700;font-variant-numeric:tabular-nums}
.tl-text{margin:4px 0 0;font-size:13.5px;line-height:1.7;color:var(--ink)}
.clock{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1.05;margin:8px 0 6px;font-variant-numeric:tabular-nums;
  background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.clock.small{font-size:32px;background:linear-gradient(120deg,var(--ai),var(--human));-webkit-background-clip:text;background-clip:text;color:transparent}
.said{margin:0;font-size:14px;line-height:1.75;color:var(--ink)}
.whisper{margin:8px 0 0;font-size:11.5px;color:var(--dim)}
.phrase-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.phrase{display:inline-flex;align-items:baseline;gap:6px;padding:7px 13px;border-radius:999px;border:1px solid var(--line-2);
  font-size:13.5px;font-weight:600;background:linear-gradient(180deg,var(--panel),transparent)}
.phrase i{font-style:normal;font-size:11.5px;color:var(--accent);font-weight:700}
.bookends{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bookend .when{font-size:11.5px;color:var(--dim);margin-left:8px;font-variant-numeric:tabular-nums}
.bookend .said{margin-top:8px;font-size:13px}
.closing{margin-top:64px;padding:52px 0 8px;border-top:1px solid var(--line);text-align:center}
.closing-line{max-width:760px;margin:0 auto;font-size:clamp(19px,2.5vw,25px);line-height:1.85;letter-spacing:-.01em;color:var(--ink)}
.closing-sign{margin:22px 0 0;font-size:13.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.closing-actions{display:flex;gap:10px;justify-content:center;margin-top:26px}
@media (max-width:820px){.moments-grid{grid-template-columns:1fr}.bookends{grid-template-columns:1fr}}
.empty{padding:80px 0;text-align:center}
.empty h3{font-size:26px;margin:0 0 10px;letter-spacing:-.02em}
.empty p{color:var(--muted);margin:0}
footer{margin-top:60px;padding-top:22px;border-top:1px solid var(--line);display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);line-height:1.9}
footer .grow{flex:1;min-width:260px}
.tip{
  position:fixed;z-index:70;pointer-events:none;opacity:0;transform:translate(-50%,-120%);
  padding:7px 11px;border-radius:10px;border:1px solid var(--line-2);
  background:color-mix(in srgb, var(--bg-2) 92%, transparent);backdrop-filter:blur(10px);
  color:var(--ink);font-size:11.5px;font-weight:600;white-space:nowrap;transition:opacity .12s ease;
  box-shadow:var(--shadow);
}
.tip.on{opacity:1}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:80;
  padding:11px 18px;border-radius:999px;border:1px solid var(--line-2);
  background:color-mix(in srgb, var(--bg-2) 94%, transparent);backdrop-filter:blur(12px);
  font-size:12.5px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s ease;box-shadow:var(--shadow);
}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:820px){
  .two,.grid2{grid-template-columns:1fr}
  .keys{display:none}
  .wrap{padding:0 16px 56px}
  .hero{padding:30px 0 26px}
}
@media print{
  body{background:#fff;color:#111}
  body::before,.bar,.actions,.nav,.scrub,.progress,.toast,.keys{display:none !important}
  .card{border-color:#e2e2e2;background:#fff;box-shadow:none;break-inside:avoid}
  h2,.kicker,.sub,.row .name,.session .meta,.note{color:#444}
  .kpi .value,.vol .n{color:#111}
  [data-reveal]{opacity:1 !important;transform:none !important}
}
</style>
</head>

<script>(function(){
  document.documentElement.classList.add('js');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var offline = location.protocol === 'file:';
  var nf = new Intl.NumberFormat(document.documentElement.lang === 'en' ? 'en-US' : 'zh-CN');
  var toastEl, tipEl, tipTimer;

  function root(){ return document.querySelector('[data-rewind-root]'); }
  function meta(){
    var el = document.getElementById('rw-meta');
    try { return el ? JSON.parse(el.textContent) : null; } catch (e) { return null; }
  }
  function ui(){
    var m = meta();

  }
  function toast(msg){
    if (!toastEl) { toastEl = document.createElement('div'); toastEl.className = 'toast'; document.body.appendChild(toastEl); }

  }
  function tipShow(text, x, y){

    tipEl.textContent = text; tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
    tipEl.classList.add('on'); clearTimeout(tipTimer);
  }
  function tipHide(){ if (tipEl) tipEl.classList.remove('on'); }

  function initNumbers(){
    var nodes = document.querySelectorAll('[data-count]');
    for (var i = 0; i < nodes.length; i++) {
      (function(el){
        var target = Number(el.getAttribute('data-count')) || 0;
        if (reduce || target === 0) { el.textContent = nf.format(target); return; }
        var start = 0;
        function step(now){
          if (!start) start = now;
          var p = Math.min(1, (now - start) / 750);
          var eased = 1 - Math.pow(1 - p, 3);
          el.textContent = nf.format(Math.round(target * eased));
          if (p < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      })(nodes[i]);
    }
  }

  function initReveal(){
    var nodes = document.querySelectorAll('[data-reveal], .chart');
    if (!('IntersectionObserver' in window) || reduce) {
      for (var i = 0; i < nodes.length; i++) nodes[i].classList.add('in');
      return;
    }
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (entry.isIntersecting) { entry.target.classList.add('in'); io.unobserve(entry.target); }
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.06 });
    for (var j = 0; j < nodes.length; j++) io.observe(nodes[j]);
  }

  function initTips(){
    document.addEventListener('mouseover', function(event){
      var target = event.target.closest ? event.target.closest('[data-tip]') : null;
      if (!target) return;
      var box = target.getBoundingClientRect();

    });
    document.addEventListener('mouseout', function(event){
      if (event.target.closest && event.target.closest('[data-tip]')) tipHide();
    });
    window.addEventListener('scroll', tipHide, { passive: true });
  }

  function bindOnce(){
    document.addEventListener('click', function(event){
      var more = event.target.closest ? event.target.closest('[data-more]') : null;
      if (more) {
        var card = more.closest('.session');
        var open = card.getAttribute('data-open') === '1';
        var extras = card.querySelectorAll('.quote.extra');
        for (var i = 0; i < extras.length; i++) extras[i].hidden = open;
        card.setAttribute('data-open', open ? '0' : '1');
        more.textContent = open ? more.getAttribute('data-open-label') : more.getAttribute('data-close-label');
        return;
      }
      var print = event.target.closest ? event.target.closest('[data-print]') : null;
      if (print) { window.print(); return; }
      var theme = event.target.closest ? event.target.closest('[data-theme-toggle]') : null;
      if (theme) {
        var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('rw-theme', next); } catch (e) {}
        return;
      }
      var share = event.target.closest ? event.target.closest('[data-share]') : null;
      if (share) { shareCard(share.getAttribute('data-share') || 'main'); return; }
      var link = event.target.closest ? event.target.closest('a[data-nav]') : null;
      if (!link) return;
      if (link.getAttribute('aria-disabled') === 'true') { event.preventDefault(); return; }

      event.preventDefault();
      var url = link.getAttribute('href');
      navigate(url);
    });
    document.addEventListener('keydown', function(event){
      if (event.metaKey || event.ctrlKey || event.altKey || event.target.matches('input,textarea')) return;
      var nav = root() && root().querySelectorAll('.nav-arrow');
      if (!nav || !nav.length) return;
      if (event.key === 'ArrowLeft' && nav[0] && nav[0].getAttribute('href')) { navigate(nav[0].getAttribute('href')); }
      if (event.key === 'ArrowRight' && nav[1] && nav[1].getAttribute('href') && nav[1].getAttribute('aria-disabled') !== 'true') { navigate(nav[1].getAttribute('href')); }

  }

  function navigate(url, options){
    options = options || {};
    if (url.charAt(0) === '#') {
      // Embedded bodies: the file carries its own recent periods, so switching
      // works from disk with no server to fetch from.
      var key = url.slice(1);
      var template = document.getElementById('rw-body-' + key);
      var host = root();
      if (template && host) {
        host.outerHTML = template.innerHTML;
        if (!options.replace) {
          try { history.pushState({ rewind: true }, '', '#' + key); } catch (e) { location.hash = key; }
        }
        init();
        if (!options.replace) window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
        return;
      }
      toast(ui().offline);
      return;
    }
    if (offline) { toast(ui().offline); return; }
    if (location.pathname + location.search === url && !options.force) return;
    var body = root();
    if (body) body.classList.add('is-loading');
    var fetchUrl = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'partial=1';
    fetch(fetchUrl, { headers: { 'x-unwrapped-partial': '1' }, credentials: 'same-origin' })
      .then(function(response){ if (!response.ok) throw new Error(response.status); return response.text(); })
      .then(function(html){
        var current = root();
        if (!current) return;
        current.outerHTML = html;
        if (!options.replace) { try { history.pushState({ rewind: true }, '', url); } catch (e) {} }
        init();
        if (!options.replace) window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
      })
      .catch(function(err){
        toast(ui().navFailed + ' · ' + err.message);
        var current = root();
        if (current) current.classList.remove('is-loading');
      });
  }

  function shareCard(kind){
    var data = meta();
    if (!data) { toast(ui().failed); return; }
    kind = kind || 'main';
    var canvas = document.createElement('canvas');
    var w = 1080, h = 1350;
    canvas.width = w; canvas.height = h;
    var ctx = canvas.getContext('2d');
    var g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, '#0a0a12'); g.addColorStop(.55, '#0d0d18'); g.addColorStop(1, '#08080e');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    var glow = ctx.createRadialGradient(w * .12, h * .06, 0, w * .12, h * .06, w * .9);
    glow.addColorStop(0, 'rgba(255,45,85,.35)'); glow.addColorStop(1, 'rgba(255,45,85,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, w, h);
    var glow2 = ctx.createRadialGradient(w * .9, h * .12, 0, w * .9, h * .12, w * .8);
    glow2.addColorStop(0, 'rgba(91,140,255,.3)'); glow2.addColorStop(1, 'rgba(91,140,255,0)');
    ctx.fillStyle = glow2; ctx.fillRect(0, 0, w, h);
    var font = '"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif';
    // Big ghost year: the Wrapped-cover cue that survives being screenshotted.
    ctx.fillStyle = 'rgba(255,255,255,.05)';
    ctx.font = '900 470px ' + font;
    ctx.textAlign = 'right';
    ctx.fillText(String(data.year || ''), w - 40, 470);
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(246,246,248,.62)';
    ctx.font = '600 30px ' + font;
    ctx.fillText(data.labels.title, 90, 150);
    ctx.fillStyle = '#ffffff';
    ctx.font = '800 96px ' + font;
    if (kind === 'contrast') {
      ctx.font = '800 150px ' + font;
      ctx.fillText(String(data.humanPct), 90, 330);
      ctx.fillStyle = 'rgba(246,246,248,.7)';
      ctx.font = '600 34px ' + font;
      ctx.fillText(data.labels.shareLabel, 90, 380);
    } else if (kind === 'phrase' && data.phrase) {
      ctx.font = '800 120px ' + font;
      ctx.fillText('「' + data.phrase.word + '」', 90, 320);
    } else if (kind === 'night' && data.night) {
      ctx.font = '800 190px ' + font;
      ctx.fillText(String(data.night.time), 90, 330);
    } else {
      ctx.fillText(String(data.period), 90, 280);
    }

    if (kind === 'contrast') {
      ctx.fillStyle = 'rgba(246,246,248,.6)';
      ctx.font = '500 40px ' + font;
      ctx.fillText(data.labels.contrastLead + ' ' + data.period, 90, 480);
      ctx.fillStyle = '#f6c88a';
      ctx.font = '800 78px ' + font;

      ctx.fillStyle = 'rgba(246,246,248,.6)';
      ctx.font = '500 32px ' + font;
      ctx.fillText(data.labels.human + ' · ' + data.labels.chars, 90, 690);
      ctx.fillStyle = '#5b8cff';
      ctx.font = '800 78px ' + font;
      ctx.fillText(data.charAi, 560, 640);
      ctx.fillStyle = 'rgba(246,246,248,.6)';
      ctx.font = '500 32px ' + font;
      ctx.fillText(data.labels.ai + ' · ' + data.labels.chars, 560, 690);
    } else if (kind === 'phrase' && data.phrase) {
      ctx.fillStyle = 'rgba(246,246,248,.6)';
      ctx.font = '500 40px ' + font;
      ctx.fillText(data.labels.phraseLead, 90, 430);
      ctx.fillStyle = '#f6c88a';
      ctx.font = '800 64px ' + font;
      ctx.fillText('×' + data.phrase.count, 90, 520);
    } else if (kind === 'night' && data.night) {
      ctx.fillStyle = 'rgba(246,246,248,.6)';
      ctx.font = '500 36px ' + font;
      ctx.fillText(data.night.label + ' · ' + data.night.when, 90, 430);

      ctx.font = '500 44px ' + font;
      wrapText(ctx, '「' + data.night.text + '」', 90, 520, 900, 62, 3);
    } else {
      ctx.fillStyle = 'rgba(246,246,248,.55)';
      ctx.font = '500 34px ' + font;
      var subtitle = data.badge || '';
      if (data.phrase) subtitle += (subtitle ? '  ·  ' : '') + '「' + data.phrase.word + '」×' + data.phrase.count;
      ctx.fillText(subtitle, 90, 345);

      var stats = [
        [nfText(data.human), data.labels.human],
        [nfText(data.ai), data.labels.ai],
        [nfText(data.turns), data.labels.rounds],
        [nfText(data.days), data.labels.days]
      ];
      var top = 470;
      for (var i = 0; i < stats.length; i++) {
        var col = i % 2, row = Math.floor(i / 2);
        var x = 90 + col * 470, y = top + row * 200;
        ctx.fillStyle = i % 2 === 0 ? '#f6c88a' : '#5b8cff';
        ctx.font = '800 88px ' + font;
        ctx.fillText(stats[i][0], x, y);
        ctx.fillStyle = 'rgba(246,246,248,.55)';
        ctx.font = '500 30px ' + font;
        ctx.fillText(stats[i][1], x, y + 52);
      }

      var barY = 1070, barW = 900, barH = 22;
      ctx.fillStyle = 'rgba(255,255,255,.1)';
      roundRect(ctx, 90, barY, barW, barH, 11); ctx.fill();
      var total = Math.max(1, data.human + data.ai);
      var hw = Math.max(6, (data.human / total) * barW);
      ctx.fillStyle = '#f6c88a'; roundRect(ctx, 90, barY, hw, barH, 11); ctx.fill();
      ctx.fillStyle = '#5b8cff'; roundRect(ctx, 90 + hw, barY, Math.max(6, barW - hw), barH, 11); ctx.fill();
    }

    ctx.fillStyle = 'rgba(246,246,248,.75)';
    ctx.font = '600 30px ' + font;
    var footY = kind === 'main' ? 1180 : 900;
    ctx.fillText(nfText(data.tokens) + ' ' + data.labels.tokens, 90, footY);

      ctx.font = '500 30px ' + font;
      wrapText(ctx, data.closing, 90, 980, 900, 44, 3);
    }
    if (kind !== 'main' && data.closing && kind !== 'contrast') {
      ctx.fillStyle = 'rgba(246,246,248,.6)';
      ctx.font = '500 32px ' + font;
      wrapText(ctx, data.closing, 90, 1000, 900, 46, 3);
    }
    // Every exported card is an ad slot: brand + the one command that installs it.
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255,255,255,.34)';
    ctx.font = '600 26px ' + font;
    ctx.fillText(data.labels.watermark, w - 90, h - 108);
    ctx.fillStyle = 'rgba(255,255,255,.22)';
    ctx.font = '500 24px ' + font;
    ctx.fillText(data.labels.install, w - 90, h - 72);

    ctx.fillStyle = 'rgba(246,246,248,.35)';
    ctx.font = '500 24px ' + font;
    ctx.fillText(data.labels.footer, 90, h - 72);

    try {
      canvas.toBlob(function(blob){
        if (!blob) { toast(ui().failed); return; }
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'unwrapped-' + kind + '-' + String(data.period).replace(/[^a-zA-Z0-9\u4e00-\u9fa5-]+/g, '_') + '.png';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
        toast(ui().saved);
      }, 'image/png');
    } catch (e) { toast(ui().failed); }
  }
  function nfText(n){ return nf.format(Math.round(Number(n) || 0)); }
  function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines){
    var line = '';
    var lines = 0;
    for (var i = 0; i < text.length; i++) {
      var test = line + text.charAt(i);
      if (ctx.measureText(test).width > maxWidth && line) {
        ctx.fillText(line, x, y);
        y += lineHeight;
        lines += 1;
        line = text.charAt(i);
        if (maxLines && lines >= maxLines) { ctx.fillText(line + '…', x, y); return; }
      } else {
        line = test;
      }
    }
    if (line) ctx.fillText(line, x, y);
  }
  function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
  }

  function init(){ initNumbers(); initReveal(); initTips(); }
  function openFromHash(){
    var hash = location.hash;
    if (!hash || hash.length < 2) return;
    var key = hash.slice(1);
    var host = root();
    if (!host || host.getAttribute('data-period-key') === key) return;
    var template = document.getElementById('rw-body-' + key);
    if (!template) return;
    host.outerHTML = template.innerHTML;
    init();
  }
  try { var saved = localStorage.getItem('rw-theme'); if (saved) document.documentElement.setAttribute('data-theme', saved); } catch (e) {}
  init(); openFromHash(); bindOnce();
})();</script>
